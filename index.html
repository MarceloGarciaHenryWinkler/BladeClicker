<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BladeClicker</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #e0e0ff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    #gameCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
    }

    /* === HUD Bar (top) === */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      background: linear-gradient(180deg, rgba(5,5,15,0.9) 0%, rgba(5,5,15,0.4) 100%);
      border-bottom: 1px solid rgba(0,255,213,0.15);
      z-index: 20;
      pointer-events: none;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .hud-item .label {
      color: #607088;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-item .val {
      color: #00ffd5;
      text-shadow: 0 0 8px rgba(0,255,213,0.4);
      font-size: 14px;
    }

    .hud-item.credits .val {
      color: #00ffd5;
      font-size: 16px;
      font-weight: bold;
    }

    .hud-item.energy .val { color: #f0c040; text-shadow: 0 0 8px rgba(240,192,64,0.4); }
    .hud-item.data .val { color: #c060ff; text-shadow: 0 0 8px rgba(192,96,255,0.4); }

    .hud-rate {
      font-size: 11px;
      color: #40a090;
    }

    .hud-divider {
      width: 1px;
      height: 24px;
      background: rgba(0,255,213,0.1);
    }

    .hud-clicks {
      margin-left: auto;
      font-size: 11px;
      color: #506070;
    }

    .hud-mute {
      background: rgba(0,255,213,0.08);
      border: 1px solid rgba(0,255,213,0.2);
      color: #00ffd5;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 1px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 3px;
      pointer-events: all;
      transition: background 0.15s;
    }
    .hud-mute:hover { background: rgba(0,255,213,0.15); }
    .hud-mute.muted { color: #504050; border-color: rgba(80,64,80,0.3); }

    /* === Side Panel === */
    #sidePanel {
      position: absolute;
      top: 48px; right: 0; bottom: 0;
      width: 280px;
      background: rgba(8,8,18,0.92);
      border-left: 1px solid rgba(0,255,213,0.12);
      z-index: 15;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    #sidePanel.collapsed {
      transform: translateX(280px);
    }

    #panelToggle {
      position: absolute;
      left: -32px;
      top: 8px;
      width: 32px;
      height: 32px;
      background: rgba(8,8,18,0.9);
      border: 1px solid rgba(0,255,213,0.2);
      border-right: none;
      color: #00ffd5;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px 0 0 4px;
    }
    #panelToggle:hover { background: rgba(0,255,213,0.1); }

    .panel-tabs {
      display: flex;
      border-bottom: 1px solid rgba(0,255,213,0.1);
      flex-shrink: 0;
    }

    .panel-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #506070;
      cursor: pointer;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .panel-tab:hover { color: #80a0b0; }
    .panel-tab.active {
      color: #00ffd5;
      border-bottom-color: #00ffd5;
    }

    .panel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .panel-list::-webkit-scrollbar { width: 4px; }
    .panel-list::-webkit-scrollbar-track { background: transparent; }
    .panel-list::-webkit-scrollbar-thumb { background: rgba(0,255,213,0.2); border-radius: 2px; }

    /* === Building / Upgrade Buttons === */
    .panel-btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: rgba(15,15,30,0.8);
      border: 1px solid rgba(0,255,213,0.12);
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      color: #d0d8e0;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .panel-btn:hover {
      border-color: rgba(0,255,213,0.35);
      background: rgba(0,255,213,0.05);
    }

    .panel-btn:active {
      background: rgba(0,255,213,0.12);
    }

    .panel-btn.disabled {
      opacity: 0.45;
      cursor: default;
    }
    .panel-btn.disabled:hover {
      border-color: rgba(0,255,213,0.12);
      background: rgba(15,15,30,0.8);
    }

    .btn-name {
      display: block;
      font-size: 13px;
      color: #e0f0ff;
      margin-bottom: 2px;
    }

    .btn-info {
      display: block;
      font-size: 10px;
      color: #607080;
      margin-bottom: 4px;
    }

    .btn-cost {
      font-size: 12px;
      color: #00ffd5;
    }

    .btn-owned {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 18px;
      color: rgba(0,255,213,0.5);
      font-weight: bold;
    }

    .upgrade-btn .btn-name { color: #c080ff; }
    .upgrade-btn .btn-cost { color: #c080ff; }
    .upgrade-btn:hover { border-color: rgba(192,96,255,0.35); background: rgba(192,96,255,0.05); }

    .panel-empty {
      text-align: center;
      padding: 24px;
      color: #404858;
      font-size: 12px;
    }

    /* === Click Feedback === */
    #clickFeedback {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .click-float {
      position: absolute;
      font-size: 18px;
      font-weight: bold;
      color: #00ffd5;
      text-shadow: 0 0 10px rgba(0,255,213,0.6), 0 0 20px rgba(0,255,213,0.3);
      pointer-events: none;
      opacity: 0;
      transform: translateY(0);
    }

    .click-float.animate {
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      50%  { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-60px) scale(0.7); }
    }

    /* === Overlay (offline report) === */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay-box {
      background: rgba(10,10,20,0.95);
      border: 1px solid rgba(0,255,213,0.25);
      border-radius: 6px;
      padding: 28px 36px;
      max-width: 360px;
      text-align: center;
    }

    .overlay-title {
      font-size: 12px;
      letter-spacing: 3px;
      color: #00ffd5;
      margin-bottom: 16px;
    }

    .overlay-msg {
      font-size: 13px;
      color: #c0d0e0;
      white-space: pre-wrap;
      line-height: 1.6;
      margin-bottom: 20px;
      font-family: inherit;
    }

    .overlay-btn {
      background: rgba(0,255,213,0.1);
      border: 1px solid rgba(0,255,213,0.3);
      color: #00ffd5;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 8px 24px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .overlay-btn:hover { background: rgba(0,255,213,0.2); }

    /* === Toast === */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(10,10,20,0.9);
      border: 1px solid rgba(0,255,213,0.2);
      color: #00ffd5;
      font-family: inherit;
      font-size: 12px;
      padding: 8px 20px;
      border-radius: 4px;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 90;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === Milestone === */
    .milestone {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(10,10,20,0.92);
      border: 1px solid rgba(192,96,255,0.3);
      border-left: 3px solid rgba(192,96,255,0.7);
      color: #c080ff;
      font-family: inherit;
      font-size: 13px;
      padding: 10px 24px;
      border-radius: 4px;
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 90;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(192,96,255,0.4);
      letter-spacing: 0.5px;
    }
    .milestone.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Bar -->
  <div id="hud">
    <div class="hud-item credits">
      <span class="label">Credits</span>
      <span class="val" id="hudCredits">0</span>
      <span class="hud-rate" id="hudCps">0/s</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-item energy" id="hudEnergy" style="display:none">
      <span class="label">Energy</span>
      <span class="val">0</span>
    </div>
    <div class="hud-item data" id="hudData" style="display:none">
      <span class="label">Data</span>
      <span class="val">0</span>
    </div>
    <span class="hud-clicks">Clicks: <span id="hudClicks">0</span></span>
    <button id="saveBtn" class="hud-mute" title="Save game">SAVE</button>
    <button id="resetBtn" class="hud-mute" title="Reset progress" style="color:#f06060;border-color:rgba(240,96,96,0.3)">RST</button>
    <button id="muteBtn" class="hud-mute" title="Toggle audio">SND</button>
  </div>

  <!-- Side Panel -->
  <div id="sidePanel">
    <button id="panelToggle">&#9666;</button>
    <div class="panel-tabs">
      <button class="panel-tab active" id="tabBuildings">Buildings</button>
      <button class="panel-tab" id="tabUpgrades">Upgrades</button>
    </div>
    <div class="panel-list" id="buildingList"></div>
    <div class="panel-list" id="upgradeList" style="display:none"></div>
  </div>

  <!-- Click Feedback Layer -->
  <div id="clickFeedback"></div>

  <!-- Offline Report Overlay -->
  <div id="offlineOverlay" class="overlay" style="display:none">
    <div class="overlay-box">
      <div class="overlay-title">OFFLINE REPORT</div>
      <pre id="offlineMsg" class="overlay-msg"></pre>
      <button id="offlineDismiss" class="overlay-btn">CONTINUE</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Milestone -->
  <div id="milestone" class="milestone"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
